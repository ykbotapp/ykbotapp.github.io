<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YK Bot - Admin Panel</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.panel {
  max-width: 450px;
  margin: 40px auto;
  padding: 25px;
  background: #1c293b;
  border-radius: 14px;
}

h2 {
  color: #38e8a5;
  text-align: center;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #38e8a5;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

.logout {
  background: #e45b5b;
  color: white;
}

#new-license {
  overflow-wrap: anywhere;
  color: #38e8a5;
}
</style>
</head>

<body>

<div class="panel">
  <h2>YK Bot Admin 🔐</h2>

  <div id="login-box">
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn">Admin Login</button>
  </div>

  <div id="admin-tools" style="display:none;">
    <label>Customer Name</label>
    <input id="customer-name" placeholder="Customer Name">

    <label>License Plan</label>
    <select id="plan">
      <option value="trial">Trial - 1 Day</option>
      <option value="weekly">Weekly - 7 Days</option>
      <option value="monthly">Monthly - 30 Days</option>
      <option value="lifetime">Lifetime</option>
    </select>

    <button id="create-btn">Create License</button>

    <p id="new-license"></p>

    <button id="logout-btn" class="logout">Logout</button>
  </div>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fnybcoirsjosoanneegt.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dwk9gV_7NB3c5UvvzollDw_0AoyACmR";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginBox = document.getElementById("login-box");
const toolsBox = document.getElementById("admin-tools");
const message = document.getElementById("message");
const newLicense = document.getElementById("new-license");

async function updateView() {
  const { data } = await client.auth.getSession();

  loginBox.style.display = data.session ? "none" : "block";
  toolsBox.style.display = data.session ? "block" : "none";
}

document.getElementById("login-btn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.textContent = "Logging in...";

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "Login failed.";    return;
  }

  await updateView();
  message.textContent = "Login successful!";
};

document.getElementById("create-btn").onclick = async () => {
  const { data } = await client.auth.getSession();

  if (!data.session) {
    message.textContent = "Admin login required.";
    return;
  }

  const plan = document.getElementById("plan").value;
  const customerName =
    document.getElementById("customer-name").value.trim();

  message.textContent = "Creating license...";
  newLicense.textContent = "";

  try {
    const response = await fetch(
      SUPABASE_URL + "/functions/v1/yk-admin-create-license",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + data.session.access_token
        },
        body: JSON.stringify({
          plan,
          customer_name: customerName
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      message.textContent =
        result.message || "License creation failed.";
      return;
    }

    newLicense.textContent =
      "License Key: " + result.license.license_key;

    message.textContent = "License created successfully!";
  } catch (error) {
    message.textContent = "Connection error.";
  }
};

document.getElementById("logout-btn").onclick = async () => {
  await client.auth.signOut();
  await updateView();
  message.textContent = "Logged out.";
};

updateView();
</script>

</body>
</html>
